version: '3.8'

services:
  web:
    build: .
    container_name: password-puzzle
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./image1.jpg:/usr/share/nginx/html/image1.jpg:ro
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/share/nginx/html
          ignore:
            - .git
            - .dockerignore
            - .gitignore
    restart: unless-stopped
